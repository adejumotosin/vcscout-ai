# Temporary one-shot historical commercial-signal diagnostic; remove after validation.
name: Diagnose historical commercial archive

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/bootstrap-commercial-backtest.yml"

permissions:
  contents: write

concurrency:
  group: vcscout-commercial-pilot
  cancel-in-progress: true

jobs:
  commercial-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -e '.[dev]'
      - name: Run tests
        run: pytest -q
      - name: Build one-company archived commercial diagnostic
        env:
          GH_PUBLIC_TOKEN: ${{ github.token }}
        run: python scripts/build_commercial_backtest.py --limit 1 --max-capture-age-days 120 --timeout 6 --workers 2
      - name: Commit diagnostic data and audit
        run: |
          git config user.name "vcscout-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/training/commercial_backtest_features.csv data/workflow_status/commercial_backtest_build.csv
          git commit -m "data: diagnose historical commercial archive" || true
          git push
