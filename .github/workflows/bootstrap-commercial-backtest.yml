# Temporary one-shot commercial-signal pilot; remove after validation.
name: Pilot commercial signals

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/bootstrap-commercial-backtest.yml"

permissions:
  contents: write

concurrency:
  group: vcscout-commercial-pilot
  cancel-in-progress: true

jobs:
  commercial-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -e '.[dev]'
      - name: Run tests
        run: pytest -q
      - name: Build 6-company archived commercial pilot
        env:
          GH_PUBLIC_TOKEN: ${{ github.token }}
        run: python scripts/build_commercial_backtest.py --limit 6 --max-capture-age-days 120
      - name: Snapshot 60 live company websites
        run: python scripts/snapshot_commercial_signals.py --limit 60 --workers 8 --timeout 12
      - name: Commit pilot data and audit
        run: |
          git config user.name "vcscout-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/training/commercial_backtest_features.csv \
                  data/workflow_status/commercial_backtest_build.csv \
                  data/commercial/live_commercial_signals.csv \
                  data/workflow_status/commercial_live_snapshot.csv
          git commit -m "data: pilot commercial signal layer" || true
          git push
