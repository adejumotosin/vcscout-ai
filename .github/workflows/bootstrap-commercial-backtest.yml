# Temporary one-shot historical commercial-signal pilot; remove after validation.
name: Pilot historical commercial signals

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/bootstrap-commercial-backtest.yml"

permissions:
  contents: write

concurrency:
  group: vcscout-commercial-pilot
  cancel-in-progress: true

jobs:
  commercial-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -e '.[dev,ml]'
      - name: Run tests
        run: pytest -q
      - name: Build 6-company archived commercial pilot
        env:
          GH_PUBLIC_TOKEN: ${{ github.token }}
        run: python scripts/build_commercial_backtest.py --limit 6 --max-capture-age-days 120 --timeout 8 --workers 4
      - name: Evaluate pilot when at least three complete pairs exist
        run: python scripts/evaluate_multimodal_backtest.py --minimum-companies 3 || echo "Pilot does not yet have enough complete pairs for grouped evaluation."
      - name: Commit pilot data and audit
        run: |
          git config user.name "vcscout-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/training/commercial_backtest_features.csv data/workflow_status/commercial_backtest_build.csv
          [ -f data/training/multimodal_backtest_predictions.csv ] && git add data/training/multimodal_backtest_predictions.csv || true
          [ -f data/model/multimodal_backtest_report.json ] && git add data/model/multimodal_backtest_report.json || true
          git commit -m "data: pilot historical commercial validation" || true
          git push
