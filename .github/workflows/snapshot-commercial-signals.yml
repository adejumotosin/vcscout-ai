name: Snapshot commercial maturity signals

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: write

concurrency:
  group: vcscout-commercial-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -e '.[dev]'
      - name: Run tests
        run: pytest -q
      - name: Snapshot full live universe
        run: python scripts/snapshot_commercial_signals.py --workers 12 --timeout 8
      - name: Commit current snapshot and history
        run: |
          if git diff --quiet -- data/commercial/ data/workflow_status/commercial_live_snapshot.csv; then
            echo "No commercial-signal changes to commit."
            exit 0
          fi
          git config user.name "vcscout-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/commercial/ data/workflow_status/commercial_live_snapshot.csv
          git commit -m "data: refresh commercial maturity signals"
          git push
