# Temporary one-shot live commercial snapshot; remove after the first dataset is committed.
name: Bootstrap live commercial signals

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/bootstrap-commercial-live.yml"

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e '.[dev]'
      - run: pytest -q
      - name: Snapshot live company websites
        run: python scripts/snapshot_commercial_signals.py --limit 100 --workers 10 --timeout 10
      - name: Commit live commercial signals
        run: |
          git config user.name "vcscout-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/commercial/live_commercial_signals.csv data/workflow_status/commercial_live_snapshot.csv
          git commit -m "data: snapshot live commercial maturity signals" || true
          git push
