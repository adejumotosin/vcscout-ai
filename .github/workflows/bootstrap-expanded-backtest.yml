name: Expanded historical signal benchmark

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/bootstrap-expanded-backtest.yml"

permissions:
  contents: write

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -e '.[dev,ml]'
      - name: Reconstruct expanded historical signal windows
        env:
          GH_PUBLIC_TOKEN: ${{ github.token }}
        run: python scripts/build_receipt_backtest.py
      - name: Compare engineering-only and expanded models
        run: python scripts/evaluate_receipt_backtest.py
      - name: Commit benchmark artifacts
        run: |
          git config user.name "vcscout-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/training/receipt_backtest_features.csv \
                  data/training/receipt_backtest_predictions.csv \
                  data/model/receipt_backtest_report.json \
                  data/model/funding_pattern_ranker.json \
                  data/workflow_status/receipt_backtest_build.csv
          git commit -m "data: benchmark expanded historical signal model" || true
          git pull --rebase origin main
          git push
