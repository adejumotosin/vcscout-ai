# Temporary one-shot governance verification; remove after it commits the selection report.
name: Finalize production model governance

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/bootstrap-expanded-backtest.yml"

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -e '.[dev,ml]'
      - name: Run tests
        run: pytest -q
      - name: Re-evaluate existing benchmark under production governance
        run: python scripts/evaluate_receipt_backtest.py
      - name: Commit governed selection report
        run: |
          git config user.name "vcscout-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/model/receipt_backtest_report.json data/model/funding_pattern_ranker.json data/training/receipt_backtest_predictions.csv
          git commit -m "model: apply production promotion policy" || true
          git pull --rebase origin main
          git push
