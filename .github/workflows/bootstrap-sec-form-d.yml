name: Bootstrap SEC Form D Q2

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/bootstrap-sec-form-d.yml"

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -e '.[dev,ml]'
      - name: Ingest, label, train, and record status
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        shell: bash
        run: |
          set +e
          mkdir -p data/workflow_status
          STATUS="success"
          DETAIL="sec_form_d_2026_q2_ingested"

          if [ -z "$SEC_USER_AGENT" ]; then
            STATUS="failed"
            DETAIL="SEC_USER_AGENT_secret_missing_or_empty"
          else
            python scripts/ingest_sec_form_d.py --year 2026 --quarter 2 --user-agent "$SEC_USER_AGENT" > /tmp/sec_ingest.log 2>&1
            INGEST_CODE=$?
            if [ "$INGEST_CODE" -ne 0 ]; then
              STATUS="failed"
              DETAIL="ingest_script_failed"
            fi
          fi

          if [ "$STATUS" = "success" ] && [ -f data/history/signals_history.csv ]; then
            python scripts/build_funding_labels.py > /tmp/labels.log 2>&1
            LABEL_CODE=$?
            if [ "$LABEL_CODE" -ne 0 ]; then
              STATUS="failed"
              DETAIL="label_builder_failed"
            fi
          fi

          MODEL_STATUS="not_attempted"
          if [ "$STATUS" = "success" ] && [ -f data/training/funding_labels.csv ]; then
            python scripts/train_funding_model.py > /tmp/model.log 2>&1
            MODEL_CODE=$?
            if [ "$MODEL_CODE" -eq 0 ]; then
              MODEL_STATUS="trained"
            else
              MODEL_STATUS="safety_gate_not_satisfied_or_training_failed"
            fi
          fi

          export STATUS DETAIL MODEL_STATUS
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path

          def tail(path, limit=1400):
              p = Path(path)
              if not p.exists():
                  return None
              text = p.read_text(errors="replace")
              return text[-limit:]

          payload = {
              "status": os.environ.get("STATUS"),
              "detail": os.environ.get("DETAIL"),
              "model_status": os.environ.get("MODEL_STATUS"),
              "period": "2026Q2",
              "recorded_at": datetime.now(timezone.utc).isoformat(),
              "ingest_log_tail": tail("/tmp/sec_ingest.log"),
              "labels_log_tail": tail("/tmp/labels.log"),
              "model_log_tail": tail("/tmp/model.log"),
          }
          Path("data/workflow_status").mkdir(parents=True, exist_ok=True)
          Path("data/workflow_status/sec_form_d_2026_q2.json").write_text(json.dumps(payload, indent=2))
          PY

          git config user.name "vcscout-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git commit -m "data: record SEC Form D 2026 Q2 bootstrap" || true
          git push

          if [ "$STATUS" != "success" ]; then
            echo "SEC bootstrap failed: $DETAIL"
            exit 1
          fi
