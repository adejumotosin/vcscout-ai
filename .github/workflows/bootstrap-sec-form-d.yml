# Temporary one-shot ranker export; remove after artifact is committed.
name: Export historical funding pattern ranker

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/bootstrap-sec-form-d.yml"

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -e '.[dev,ml]'
      - name: Evaluate and export portable ranker
        run: python scripts/evaluate_receipt_backtest.py
      - name: Commit ranker artifact and refreshed report
        run: |
          git config user.name "vcscout-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/model/funding_pattern_ranker.json \
                  data/model/receipt_backtest_report.json \
                  data/training/receipt_backtest_predictions.csv
          git commit -m "model: export historical funding pattern ranker" || true
          git push
