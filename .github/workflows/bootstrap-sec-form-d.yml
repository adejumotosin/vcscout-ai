name: Bootstrap VCScout historical labels

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/bootstrap-sec-form-d.yml"

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -e '.[dev,ml]'
      - name: Backfill history, build labels, train when eligible, and record status
        shell: bash
        run: |
          set +e
          mkdir -p data/workflow_status
          STATUS="success"
          DETAIL="history_and_labels_built"

          python scripts/import_gitdealflow_history.py > /tmp/history.log 2>&1
          HISTORY_CODE=$?
          if [ "$HISTORY_CODE" -ne 0 ]; then
            STATUS="failed"
            DETAIL="history_import_failed"
          fi

          if [ "$STATUS" = "success" ]; then
            python scripts/build_funding_labels.py > /tmp/labels.log 2>&1
            LABEL_CODE=$?
            if [ "$LABEL_CODE" -ne 0 ]; then
              STATUS="failed"
              DETAIL="label_builder_failed"
            fi
          fi

          MODEL_STATUS="not_attempted"
          if [ "$STATUS" = "success" ] && [ -f data/training/funding_labels.csv ]; then
            python scripts/train_funding_model.py > /tmp/model.log 2>&1
            MODEL_CODE=$?
            if [ "$MODEL_CODE" -eq 0 ]; then
              MODEL_STATUS="trained"
            else
              MODEL_STATUS="safety_gate_not_satisfied_or_training_failed"
            fi
          fi

          export STATUS DETAIL MODEL_STATUS
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path

          def tail(path, limit=2200):
              p = Path(path)
              if not p.exists():
                  return None
              return p.read_text(errors="replace")[-limit:]

          payload = {
              "status": os.environ.get("STATUS"),
              "detail": os.environ.get("DETAIL"),
              "model_status": os.environ.get("MODEL_STATUS"),
              "recorded_at": datetime.now(timezone.utc).isoformat(),
              "history_log_tail": tail("/tmp/history.log"),
              "labels_log_tail": tail("/tmp/labels.log"),
              "model_log_tail": tail("/tmp/model.log"),
          }
          Path("data/workflow_status").mkdir(parents=True, exist_ok=True)
          Path("data/workflow_status/history_labels_bootstrap.json").write_text(json.dumps(payload, indent=2))
          PY

          git config user.name "vcscout-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git commit -m "data: backfill VCScout history and funding labels" || true
          git push

          if [ "$STATUS" != "success" ]; then
            echo "VCScout history bootstrap failed: $DETAIL"
            exit 1
          fi
