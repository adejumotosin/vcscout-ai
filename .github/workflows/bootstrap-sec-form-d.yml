# Temporary one-shot full historical backtest; remove after validation.
name: Full historical funding backtest

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/bootstrap-sec-form-d.yml"

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -e '.[dev,ml]'
      - name: Reconstruct all validated funding windows
        env:
          GH_PUBLIC_TOKEN: ${{ github.token }}
        run: python scripts/build_receipt_backtest.py
      - name: Evaluate grouped out-of-sample backtest
        run: python scripts/evaluate_receipt_backtest.py
      - name: Commit backtest dataset, predictions, report, and audit status
        run: |
          git config user.name "vcscout-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/training/receipt_backtest_features.csv \
                  data/training/receipt_backtest_predictions.csv \
                  data/model/receipt_backtest_report.json \
                  data/workflow_status/receipt_backtest_build.csv
          git commit -m "data: complete historical funding backtest" || true
          git push
