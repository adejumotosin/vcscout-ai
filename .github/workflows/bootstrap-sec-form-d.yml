# Temporary one-shot entity-resolution audit; remove after report is committed.
name: Audit SEC entity resolution candidates

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/bootstrap-sec-form-d.yml"

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -e '.[dev]'
      - name: Build candidate legal-entity audit
        run: python scripts/audit_entity_matches.py
      - name: Commit audit reports
        run: |
          git config user.name "vcscout-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/workflow_status/entity_match_audit.csv data/workflow_status/entity_match_high_confidence.csv
          git commit -m "data: audit SEC entity match candidates" || true
          git push
