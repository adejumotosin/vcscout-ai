name: Bootstrap complete SEC outcome coverage

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/bootstrap-sec-form-d.yml"

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -e '.[dev,ml]'
      - name: Backfill SEC coverage, rebuild labels, and train when eligible
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        shell: bash
        run: |
          set +e
          mkdir -p data/workflow_status
          STATUS="success"
          DETAIL="complete_sec_coverage_ingested"

          if [ -z "$SEC_USER_AGENT" ]; then
            STATUS="failed"
            DETAIL="SEC_USER_AGENT_secret_missing_or_empty"
          else
            : > /tmp/sec_backfill.log
            for PERIOD in "2025 3" "2025 4" "2026 1" "2026 2"; do
              set -- $PERIOD
              YEAR=$1
              QUARTER=$2
              echo "=== ${YEAR}Q${QUARTER} ===" >> /tmp/sec_backfill.log
              python scripts/ingest_sec_form_d.py --year "$YEAR" --quarter "$QUARTER" --user-agent "$SEC_USER_AGENT" >> /tmp/sec_backfill.log 2>&1
              CODE=$?
              if [ "$CODE" -ne 0 ]; then
                STATUS="failed"
                DETAIL="sec_backfill_failed_${YEAR}Q${QUARTER}"
                break
              fi
            done
          fi

          if [ "$STATUS" = "success" ]; then
            python scripts/build_funding_labels.py --as-of 2026-06-30 > /tmp/labels.log 2>&1
            LABEL_CODE=$?
            if [ "$LABEL_CODE" -ne 0 ]; then
              STATUS="failed"
              DETAIL="label_builder_failed"
            fi
          fi

          MODEL_STATUS="not_attempted"
          if [ "$STATUS" = "success" ] && [ -f data/training/funding_labels.csv ]; then
            python scripts/train_funding_model.py > /tmp/model.log 2>&1
            MODEL_CODE=$?
            if [ "$MODEL_CODE" -eq 0 ]; then
              MODEL_STATUS="trained"
            else
              MODEL_STATUS="safety_gate_not_satisfied_or_training_failed"
            fi
          fi

          export STATUS DETAIL MODEL_STATUS
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path

          def tail(path, limit=3500):
              p = Path(path)
              return p.read_text(errors="replace")[-limit:] if p.exists() else None

          payload = {
              "status": os.environ.get("STATUS"),
              "detail": os.environ.get("DETAIL"),
              "model_status": os.environ.get("MODEL_STATUS"),
              "coverage": ["2025Q3", "2025Q4", "2026Q1", "2026Q2"],
              "label_as_of": "2026-06-30",
              "recorded_at": datetime.now(timezone.utc).isoformat(),
              "sec_log_tail": tail("/tmp/sec_backfill.log"),
              "labels_log_tail": tail("/tmp/labels.log"),
              "model_log_tail": tail("/tmp/model.log"),
          }
          Path("data/workflow_status").mkdir(parents=True, exist_ok=True)
          Path("data/workflow_status/sec_coverage_backfill.json").write_text(json.dumps(payload, indent=2))
          PY

          git config user.name "vcscout-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git commit -m "data: complete SEC funding outcome coverage" || true
          git push

          if [ "$STATUS" != "success" ]; then
            echo "SEC outcome backfill failed: $DETAIL"
            exit 1
          fi
