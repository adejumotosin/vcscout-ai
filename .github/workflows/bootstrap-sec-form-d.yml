# Temporary one-shot historical backtest pilot; remove after validation.
name: Pilot historical funding backtest

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/bootstrap-sec-form-d.yml"

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -e '.[dev]'
      - name: Reconstruct a 10-event GitHub pilot
        env:
          GH_PUBLIC_TOKEN: ${{ github.token }}
        run: python scripts/build_receipt_backtest.py --limit 10
      - name: Commit pilot dataset and audit status
        run: |
          git config user.name "vcscout-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/training/receipt_backtest_features.csv data/workflow_status/receipt_backtest_build.csv
          git commit -m "data: build receipt backtest pilot" || true
          git push
