# Temporary one-shot validated-receipts import; remove after data is committed.
name: Import validated funding receipts

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/bootstrap-sec-form-d.yml"

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          pip install -e '.[dev]'
          pip install 'beautifulsoup4>=4.12,<5'
      - name: Import public validated receipts
        run: python scripts/import_validated_receipts.py
      - name: Commit receipt datasets
        run: |
          git config user.name "vcscout-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/funding_events/gitdealflow_validated_receipts.csv data/funding_events/gitdealflow_validated_funding_receipts.csv
          git commit -m "data: import validated GitDealFlow funding receipts" || true
          git push
