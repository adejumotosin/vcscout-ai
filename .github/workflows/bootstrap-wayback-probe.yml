# Temporary connectivity/coverage probe; remove after result is committed.
name: Probe Wayback historical coverage

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/bootstrap-wayback-probe.yml"

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python scripts/probe_wayback.py
      - name: Commit probe result
        run: |
          git config user.name "vcscout-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/workflow_status/wayback_probe.json
          git commit -m "data: record Wayback coverage probe" || true
          git push
