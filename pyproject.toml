[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vcscout-ai"
version = "0.2.0"
description = "Alternative-data venture sourcing engine using public GitHub engineering signals"
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.2,<3",
  "numpy>=1.26,<3",
  "requests>=2.32,<3",
  "fastapi>=0.115,<1",
]

[project.optional-dependencies]
local = [
  "uvicorn[standard]>=0.30,<1",
]
ml = [
  "scikit-learn>=1.5,<2",
]
dev = [
  "pytest>=8.3,<9",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
